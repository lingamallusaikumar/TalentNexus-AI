{% extends 'base.html' %}

{% block title %}Create Job Requisition | TalentNexus AI{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h2><i class="fa-solid fa-plus-circle"></i> Create New Job Requisition</h2>
        <a href="/jobs" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Jobs</a>
    </div>

    <div class="card">
        <form id="create-job-form" method="POST" action="/api/v1/jobs">
            <div class="form-group">
                <label for="title">Job Title</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Senior Python Architect" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" name="department" class="form-control">
                        <option value="Engineering">Engineering</option>
                        <option value="Product">Product</option>
                        <option value="Data Science">Data Science</option>
                        <option value="DevOps">DevOps</option>
                        <option value="Design">Design</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                        <option value="HR">Human Resources</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" class="form-control" placeholder="e.g. Remote / San Francisco, CA">
                </div>
            </div>
            <div class="form-group">
                <label for="description">Job Description</label>
                <textarea id="description" name="description" class="form-control" rows="6" placeholder="Describe the role, responsibilities, and requirements..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="min_salary">Min Salary (USD)</label>
                    <input type="number" id="min_salary" name="min_salary" class="form-control" placeholder="120000">
                </div>
                <div class="form-group">
                    <label for="max_salary">Max Salary (USD)</label>
                    <input type="number" id="max_salary" name="max_salary" class="form-control" placeholder="180000">
                </div>
            </div>
            <div class="form-group">
                <label for="required_skills">Required Skills (comma-separated)</label>
                <input type="text" id="required_skills" name="required_skills" class="form-control" placeholder="Python, Flask, PostgreSQL, Docker, Kubernetes">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-rocket"></i> Publish Job Requisition</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
