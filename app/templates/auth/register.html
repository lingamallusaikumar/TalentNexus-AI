{% extends 'base.html' %}

{% block title %}Register Organization | TalentNexus AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fa-solid fa-building auth-icon"></i>
            <h2>Register Your Organization</h2>
            <p>Start screen candidates with Explainable AI intelligence</p>
        </div>
        <form id="register-form" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="first_name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="last_name" class="form-input" required>
                </div>
            </div>
            <div class="form-group">
                <label>Company / Organization Name</label>
                <input type="text" id="organization_name" class="form-input" placeholder="Acme Global Inc." required>
            </div>
            <div class="form-group">
                <label>Work Email</label>
                <input type="email" id="email" class="form-input" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" minlength="8" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="role" class="form-input">
                    <option value="Organization Admin">Organization Admin</option>
                    <option value="HR Manager">HR Manager</option>
                    <option value="Recruiter">Recruiter</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Tenant Account</button>
        </form>
    </div>
</div>
{% endblock %}
