{% extends 'base.html' %}

{% block title %}Login | TalentNexus AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fa-solid fa-brain-circuit auth-icon"></i>
            <h2>Welcome to TalentNexus AI</h2>
            <p>Enterprise Recruitment & Screening Platform</p>
        </div>
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" class="form-input" placeholder="recruiter@enterprise.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label for="two_factor">2FA Authenticator Code (Optional)</label>
                <input type="text" id="two_factor" class="form-input" placeholder="6-digit code">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In to Workspace</button>
            <div class="auth-footer">
                <a href="/register">Create new organization account</a> • <a href="#">Forgot password?</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
