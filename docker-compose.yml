version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://talentnexus:secret@db:5432/talentnexus
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: flask run --host=0.0.0.0 --port=8000 --debug

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=talentnexus
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=talentnexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    command: celery -A app.extensions.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://talentnexus:secret@db:5432/talentnexus
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
